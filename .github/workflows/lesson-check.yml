name: lesson check

on:
  pull_request:
    paths:
      - "lessons/src/**"
      - "lessons/*.json"
      - "tools/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          repository: ctroy978/readingHarness
          path: readingHarness

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect the sources this pull request changes
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base...HEAD" -- 'lessons/src/*.source.json' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "sources changed: ${files:-none}"

      - name: Compile check, validator, new-lesson key checks
        run: |
          python3 tools/check.py --harness readingHarness ${{ steps.changed.outputs.files }}
